name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      # Ключи источников матчей и коэффициентов для прогнозов (необязательные)
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      # Telegram ID администраторов через запятую: Settings → Secrets and variables → Actions → Variables
      ADMIN_IDS: ${{ vars.ADMIN_IDS }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BOT_TOKEN" ]; then
            echo "::warning::Добавьте секреты CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID и BOT_TOKEN (см. README)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Run tests
        if: steps.secrets.outputs.ready == 'true'
        run: npm test

      - name: Create D1 database if missing
        if: steps.secrets.outputs.ready == 'true'
        run: |
          id=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name == "tots") | .uuid')
          if [ -z "$id" ]; then
            npx -y wrangler@4 d1 create tots
            id=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name == "tots") | .uuid')
          fi
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml

      - name: Save database restore point
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Откат базы к состоянию до этого деплоя:
          #   npx wrangler d1 time-travel restore tots --timestamp=<время из этого шага>
          echo "Restore point (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$GITHUB_STEP_SUMMARY"
          npx -y wrangler@4 d1 time-travel info tots

      - name: Pause writes for database update
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cat > worker/release-maintenance.js <<'JS'
          export default {
            fetch() { return new Response('Обновление приложения. Попробуйте через несколько минут.', {status:503,headers:{'Content-Type':'text/plain; charset=utf-8','Retry-After':'120','Cache-Control':'no-store'}}); },
            scheduled() {}
          };
          JS
          cp -r webapp dist
          npx -y wrangler@4 deploy worker/release-maintenance.js --var "ADMIN_IDS:${ADMIN_IDS:-}"

      - name: Backup and rehearse migrations
        if: steps.secrets.outputs.ready == 'true'
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/tots-release"
          npx -y wrangler@4 d1 export tots --remote --output="$RUNNER_TEMP/tots-release/before.sql"
          npx -y wrangler@4 d1 execute tots --remote --command='SELECT name FROM d1_migrations' --json > "$RUNNER_TEMP/tots-release/applied.json"
          python3 scripts/check-release-data.py rehearse "$RUNNER_TEMP/tots-release/before.sql" "$RUNNER_TEMP/tots-release/applied.json"

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx -y wrangler@4 d1 migrations apply tots --remote

      - name: Verify preserved history
        if: steps.secrets.outputs.ready == 'true'
        run: |
          umask 077
          npx -y wrangler@4 d1 export tots --remote --output="$RUNNER_TEMP/tots-release/after.sql"
          python3 scripts/check-release-data.py compare "$RUNNER_TEMP/tots-release/before.sql" "$RUNNER_TEMP/tots-release/after.sql"

      - name: Build frontend
        if: steps.secrets.outputs.ready == 'true'
        run: |
          rm -rf dist
          cp -r webapp dist

      - name: Deploy worker
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx -y wrangler@4 deploy --var "ADMIN_IDS:${ADMIN_IDS:-}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set bot token
        if: steps.secrets.outputs.ready == 'true'
        run: printf '%s' "$BOT_TOKEN" | tr -d '[:space:]' | npx -y wrangler@4 secret put BOT_TOKEN

      - name: Set match data keys
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Без ключей сервис работает, но новые матчи и коэффициенты не появляются
          for name in FOOTBALL_DATA_TOKEN ODDSPAPI_KEY; do
            value=$(printenv "$name" | tr -d '[:space:]')
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx -y wrangler@4 secret put "$name" >/dev/null && echo "$name: set"
            else
              echo "::warning::Секрет $name не задан: прогнозы не будут обновляться"
            fi
          done

      - name: Connect bot to the worker
        if: steps.secrets.outputs.ready == 'true'
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          token=$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')
          secret=$(printf '%s' "$token" | sha256sum | cut -c1-32)
          api="https://api.telegram.org/bot$token"
          curl -sS "$api/getMe" | jq -c '{ok, username: .result.username}'
          # Вебхук: Telegram пересылает сообщения боту на сервер (ответ на /start)
          curl -sS "$api/setWebhook" -d "url=$APP_URL/telegram/webhook" -d "secret_token=$secret" \
            -d 'allowed_updates=["message"]' | jq -c '{ok, description}'
          # Кнопка меню рядом с полем ввода, открывающая мини-приложение
          jq -nc --arg url "$APP_URL/" '{menu_button: {type: "web_app", text: "TOTS", web_app: {url: $url}}}' \
            | curl -sS "$api/setChatMenuButton" -H 'Content-Type: application/json' -d @- | jq -c '{ok, description}'

      - name: Clean private release snapshots
        if: always()
        run: rm -rf "$RUNNER_TEMP/tots-release"
