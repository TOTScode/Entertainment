# Конфигурация Cloudflare Worker для TOTS.
# database_id подставляется автоматически в .github/workflows/cloudflare.yml
name = "tots"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
START_BALANCE = "10"
# Telegram ID администраторов через запятую. В деплое берётся из переменной репозитория ADMIN_IDS.
ADMIN_IDS = ""

[[d1_databases]]
binding = "DB"
database_name = "tots"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "worker/migrations"

# Тестовая копия для проверки PR до мёржа: отдельный Worker и отдельная база.
# Деплоится из .github/workflows/preview.yml, адрес https://tots-preview.<поддомен>.workers.dev
[env.preview]
name = "tots-preview"

[env.preview.vars]
START_BALANCE = "10"
ADMIN_IDS = ""

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tots-preview"
database_id = "__D1_PREVIEW_ID__"
migrations_dir = "worker/migrations"
