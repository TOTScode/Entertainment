name: Preview deploy

# Тестовая копия приложения для проверки PR до мёржа.
# База tots-preview каждый раз пересоздаётся из копии рабочей базы, затем применяются новые миграции,
# так что миграция проверяется на настоящих данных, а рабочая база не меняется.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ vars.ADMIN_IDS }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BOT_TOKEN" ]; then
            echo "::warning::Нет секретов Cloudflare, тестовая копия не выкладывается"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Run tests
        if: steps.secrets.outputs.ready == 'true'
        run: npm test

      - name: Recreate preview database from production copy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          w="npx -y wrangler@4"
          prod=$($w d1 list --json | jq -r '.[] | select(.name == "tots") | .uuid')
          old=$($w d1 list --json | jq -r '.[] | select(.name == "tots-preview") | .uuid')
          if [ -n "$old" ]; then $w d1 delete tots-preview -y; fi
          $w d1 create tots-preview
          id=$($w d1 list --json | jq -r '.[] | select(.name == "tots-preview") | .uuid')
          sed -i "s/__D1_DATABASE_ID__/$prod/; s/__D1_PREVIEW_ID__/$id/" wrangler.toml
          if [ -n "$prod" ]; then
            $w d1 export tots --remote --output prod.sql
            $w d1 execute tots-preview --remote --file prod.sql -y
          fi

      - name: Apply new migrations to the copy
        if: steps.secrets.outputs.ready == 'true'
        run: npx -y wrangler@4 d1 migrations apply tots-preview --remote --env preview

      - name: Deploy preview
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cp -r webapp dist
          npx -y wrangler@4 deploy --env preview --var "ADMIN_IDS:${ADMIN_IDS:-}" | tee deploy.log
          printf '%s' "$BOT_TOKEN" | tr -d '[:space:]' | npx -y wrangler@4 secret put BOT_TOKEN --env preview
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Тестовая копия: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Откройте в Telegram мини-приложение бота, у которого указан этот адрес (см. README)." >> "$GITHUB_STEP_SUMMARY"
