<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>TOTS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="top">
    <div class="logo">TOTS</div>
  </header>

  <main>
    <section id="profile" class="card profile hidden">
      <div id="avatar" class="avatar"></div>
      <div>
        <div id="name" class="name"></div>
        <div id="username" class="muted"></div>
      </div>
    </section>

    <section id="wallet" class="card wallet hidden">
      <div class="muted">Баланс</div>
      <div class="balance"><span id="balance">—</span> <span id="coin-label">бистов</span></div>
      <div id="welcome" class="welcome hidden"></div>
    </section>

    <section id="loading" class="card muted">Загрузка…</section>
    <section id="error" class="card error hidden"></section>
  </main>

  <script src="static/config.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
