name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      # Telegram ID администраторов через запятую: Settings → Secrets and variables → Actions → Variables
      ADMIN_IDS: ${{ vars.ADMIN_IDS }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BOT_TOKEN" ]; then
            echo "::warning::Добавьте секреты CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID и BOT_TOKEN (см. README)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Run tests
        if: steps.secrets.outputs.ready == 'true'
        run: npm test

      - name: Create D1 database if missing
        if: steps.secrets.outputs.ready == 'true'
        run: |
          id=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name == "tots") | .uuid')
          if [ -z "$id" ]; then
            npx -y wrangler@4 d1 create tots
            id=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name == "tots") | .uuid')
          fi
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx -y wrangler@4 d1 migrations apply tots --remote

      - name: Build frontend
        if: steps.secrets.outputs.ready == 'true'
        run: cp -r webapp dist

      - name: Deploy worker
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx -y wrangler@4 deploy --var "ADMIN_IDS:${ADMIN_IDS:-}" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set bot token
        if: steps.secrets.outputs.ready == 'true'
        run: printf '%s' "$BOT_TOKEN" | tr -d '[:space:]' | npx -y wrangler@4 secret put BOT_TOKEN

      - name: Connect bot to the worker
        if: steps.secrets.outputs.ready == 'true'
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          token=$(printf '%s' "$BOT_TOKEN" | tr -d '[:space:]')
          secret=$(printf '%s' "$token" | sha256sum | cut -c1-32)
          api="https://api.telegram.org/bot$token"
          curl -sS "$api/getMe" | jq -c '{ok, username: .result.username}'
          # Вебхук: Telegram пересылает сообщения боту на сервер (ответ на /start)
          curl -sS "$api/setWebhook" -d "url=$APP_URL/telegram/webhook" -d "secret_token=$secret" \
            -d 'allowed_updates=["message"]' | jq -c '{ok, description}'
          # Кнопка меню рядом с полем ввода, открывающая мини-приложение
          jq -nc --arg url "$APP_URL/" '{menu_button: {type: "web_app", text: "TOTS", web_app: {url: $url}}}' \
            | curl -sS "$api/setChatMenuButton" -H 'Content-Type: application/json' -d @- | jq -c '{ok, description}'
