# Конфигурация Cloudflare Worker для TOTS.
# database_id подставляется автоматически в .github/workflows/cloudflare.yml
name = "tots"
main = "worker/src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"

# 1 21 * * * — снимок рейтинга для стрелок изменения места: 00:01 по Москве (21:01 UTC)
# */30 * * * * — матчи, коэффициенты и результаты для прогнозов
[triggers]
crons = ["1 21 * * *", "*/30 * * * *"]

[vars]
START_BALANCE = "10"
# Telegram ID администраторов через запятую. В деплое берётся из переменной репозитория ADMIN_IDS.
ADMIN_IDS = ""

[[d1_databases]]
binding = "DB"
database_name = "tots"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "worker/migrations"

