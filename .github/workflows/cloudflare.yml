name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BOT_TOKEN" ]; then
            echo "::warning::Добавьте секреты CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID и BOT_TOKEN (см. README)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Create D1 database if missing
        if: steps.secrets.outputs.ready == 'true'
        run: |
          id=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name == "tots") | .uuid')
          if [ -z "$id" ]; then
            npx -y wrangler@4 d1 create tots
            id=$(npx -y wrangler@4 d1 list --json | jq -r '.[] | select(.name == "tots") | .uuid')
          fi
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx -y wrangler@4 d1 migrations apply tots --remote

      - name: Build frontend
        if: steps.secrets.outputs.ready == 'true'
        run: |
          cp -r webapp dist
          echo 'window.TOTS_API_URL = "";' > dist/static/config.js

      - name: Deploy worker
        if: steps.secrets.outputs.ready == 'true'
        run: npx -y wrangler@4 deploy

      - name: Set bot token
        if: steps.secrets.outputs.ready == 'true'
        run: echo "$BOT_TOKEN" | npx -y wrangler@4 secret put BOT_TOKEN
