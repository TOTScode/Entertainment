name: Probe football APIs

# Ручная проверка бесплатных API для прогнозов: Actions → Probe football APIs → Run workflow
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "all — всё, odds — только коэффициенты, markets — справочник рынков"
        default: all

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      PROBE: ${{ inputs.probe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-apis.mjs
